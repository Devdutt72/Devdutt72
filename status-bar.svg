<svg viewBox="0 0 1000 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Status: Data Analyst · Actively Learning">
  <defs>
    <pattern id="sGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#141414" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1000" height="160" fill="#050505"/>
  <rect width="1000" height="160" fill="url(#sGrid)"/>

  <!-- terminal frame -->
  <rect x="30" y="10" width="940" height="140" rx="4" fill="#0A0A0A" stroke="#2A2A2A" stroke-width="1"/>

  <!-- title bar -->
  <rect x="30" y="10" width="940" height="28" rx="4" fill="#101010"/>
  <rect x="30" y="34" width="940" height="4" fill="#0A0A0A"/>

  <!-- window dots — only animation in this SVG -->
  <circle cx="52" cy="24" r="4" fill="#FF7A00">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="68" cy="24" r="4" fill="#8A8A8A">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="84" cy="24" r="4" fill="#1E1E1E"/>

  <!-- title -->
  <text x="500" y="28" font-family="'JetBrains Mono','Courier New',monospace" font-size="10" fill="#4A4A4A" text-anchor="middle" letter-spacing="3">SYSTEM.STATUS</text>

  <!-- line 1 -->
  <text x="52" y="62" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#555">$</text>
  <text x="68" y="62" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#8A8A8A">role</text>
  <text x="120" y="62" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#FF7A00">Data Analyst</text>
  <text x="280" y="62" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#333">·</text>
  <text x="300" y="62" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#8A8A8A">turning raw data into clear answers</text>

  <!-- line 2 -->
  <text x="52" y="86" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#555">$</text>
  <text x="68" y="86" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#8A8A8A">stack</text>
  <text x="128" y="86" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#FF7A00">Excel</text>
  <text x="190" y="86" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#333">│</text>
  <text x="206" y="86" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#FF7A00">SQL</text>
  <text x="246" y="86" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#333">│</text>
  <text x="262" y="86" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#FF7A00">Python</text>
  <text x="342" y="86" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#333">│</text>
  <text x="358" y="86" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#FF7A00">Statistics</text>

  <!-- line 3 -->
  <text x="52" y="110" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#555">$</text>
  <text x="68" y="110" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#8A8A8A">focus</text>
  <text x="128" y="110" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#CCCCCC">a clean-looking number ≠ a correct number</text>

  <!-- line 4 -->
  <text x="52" y="134" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#555">$</text>
  <text x="68" y="134" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#8A8A8A">status</text>
  <circle cx="140" cy="130" r="3" fill="#22C55E">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="152" y="134" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#22C55E">ACTIVELY LEARNING</text>

  <!-- blinking cursor -->
  <rect x="340" y="124" width="7" height="13" fill="#FF7A00">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
