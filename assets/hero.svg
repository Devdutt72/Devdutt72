<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Devdutt Chauhan — Data Analyst">
  <defs>
    <pattern id="heroGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#141414" stroke-width="0.8"/>
    </pattern>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D4FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1000" height="300" fill="#050505"/>
  <rect width="1000" height="300" fill="url(#heroGrid)"/>

  <!-- ambient glow -->
  <ellipse cx="500" cy="150" rx="350" ry="140" fill="url(#glowCyan)"/>

  <!-- animated scan line -->
  <rect x="0" y="0" width="1000" height="3" fill="url(#lineFlow)">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,300;0,0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- bar chart (left side) -->
  <g transform="translate(70,220)" opacity="0.35">
    <rect x="0" y="-60" width="12" height="60" fill="url(#barGrad)" rx="2">
      <animate attributeName="height" values="60;90;60" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-60;-90;-60" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="18" y="-90" width="12" height="90" fill="url(#barGrad)" rx="2">
      <animate attributeName="height" values="90;55;90" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-90;-55;-90" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="36" y="-45" width="12" height="45" fill="url(#barGrad)" rx="2">
      <animate attributeName="height" values="45;80;45" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-45;-80;-45" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="54" y="-75" width="12" height="75" fill="url(#barGrad)" rx="2">
      <animate attributeName="height" values="75;50;75" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-75;-50;-75" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="72" y="-100" width="12" height="100" fill="url(#barGrad)" rx="2">
      <animate attributeName="height" values="100;65;100" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-100;-65;-100" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- scatter dots (right side) -->
  <g opacity="0.3">
    <circle cx="830" cy="80" r="3" fill="#00D4FF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="870" cy="120" r="4" fill="#00D4FF">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="910" cy="90" r="2.5" fill="#00D4FF">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="160" r="3.5" fill="#00D4FF">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="890" cy="180" r="2" fill="#00D4FF">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="920" cy="145" r="3" fill="#00D4FF">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="940" cy="200" r="2.5" fill="#00D4FF">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- trend line through scatter -->
    <line x1="820" y1="190" x2="950" y2="75" stroke="#00D4FF" stroke-width="1" stroke-dasharray="4,4" opacity="0.3">
      <animate attributeName="stroke-dashoffset" values="0;-16" dur="2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- main text -->
  <text x="500" y="110" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="42" fill="#FFFFFF" text-anchor="middle" font-weight="700" letter-spacing="2">DEVDUTT CHAUHAN</text>

  <!-- subtitle with cursor blink -->
  <text x="500" y="150" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="16" fill="#00D4FF" text-anchor="middle" letter-spacing="4">DATA ANALYST</text>

  <!-- tagline -->
  <text x="500" y="190" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="12" fill="#6B7280" text-anchor="middle" letter-spacing="1">I ask questions before I trust numbers</text>

  <!-- blinking cursor -->
  <rect x="678" y="178" width="8" height="14" fill="#00D4FF">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom border accent -->
  <rect x="350" y="220" width="300" height="1" fill="#00D4FF" opacity="0.3"/>
  <circle cx="350" cy="220" r="2" fill="#00D4FF" opacity="0.5"/>
  <circle cx="650" cy="220" r="2" fill="#00D4FF" opacity="0.5"/>

  <!-- corner markers -->
  <g stroke="#2A2A2A" stroke-width="1" fill="none">
    <path d="M 15,5 L 5,5 5,15"/>
    <path d="M 985,5 L 995,5 995,15"/>
    <path d="M 15,295 L 5,295 5,285"/>
    <path d="M 985,295 L 995,295 995,285"/>
  </g>

  <!-- coordinates label -->
  <text x="20" y="290" font-family="'JetBrains Mono',monospace" font-size="9" fill="#2A2A2A">sys.data.analyst.v1</text>
  <text x="900" y="290" font-family="'JetBrains Mono',monospace" font-size="9" fill="#2A2A2A">2026.active</text>
</svg>
