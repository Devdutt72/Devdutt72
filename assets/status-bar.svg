<svg viewBox="0 0 1000 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Status Panel: Data Analyst building clarity from raw data">
  <defs>
    <pattern id="statusGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#111111" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="pulseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D4FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1000" height="180" fill="#050505"/>
  <rect width="1000" height="180" fill="url(#statusGrid)"/>

  <!-- terminal frame -->
  <rect x="24" y="12" width="952" height="156" rx="6" fill="#0A0A0A" stroke="#1E1E1E" stroke-width="1"/>

  <!-- title bar -->
  <rect x="24" y="12" width="952" height="28" rx="6" fill="#0E0E0E"/>
  <rect x="24" y="34" width="952" height="6" fill="#0A0A0A"/>

  <!-- window dots -->
  <circle cx="46" cy="26" r="4" fill="#00D4FF">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="62" cy="26" r="4" fill="#6B7280">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="78" cy="26" r="4" fill="#1E1E1E"/>

  <!-- title -->
  <text x="500" y="30" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11" fill="#4A4A4A" text-anchor="middle" letter-spacing="2">SYSTEM STATUS</text>

  <!-- scan line -->
  <rect x="24" y="12" width="952" height="2" fill="url(#pulseGrad)" rx="1">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,156;0,0" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- status lines -->
  <text x="48" y="68" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#3B3B3B">$</text>
  <text x="62" y="68" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#6B7280">role</text>
  <text x="110" y="68" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#00D4FF">Data Analyst</text>
  <text x="280" y="68" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#3B3B3B">·</text>
  <text x="300" y="68" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#6B7280">turning raw data into clear, actionable answers</text>

  <text x="48" y="92" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#3B3B3B">$</text>
  <text x="62" y="92" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#6B7280">stack</text>
  <text x="120" y="92" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#00D4FF">Excel</text>
  <text x="180" y="92" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#3B3B3B">│</text>
  <text x="200" y="92" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#00D4FF">SQL</text>
  <text x="240" y="92" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#3B3B3B">│</text>
  <text x="260" y="92" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#00D4FF">Python</text>
  <text x="340" y="92" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#3B3B3B">│</text>
  <text x="360" y="92" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#00D4FF">Pandas</text>
  <text x="440" y="92" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#3B3B3B">│</text>
  <text x="460" y="92" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#00D4FF">NumPy</text>
  <text x="540" y="92" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#3B3B3B">│</text>
  <text x="560" y="92" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#00D4FF">Statistics</text>

  <text x="48" y="116" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#3B3B3B">$</text>
  <text x="62" y="116" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#6B7280">focus</text>
  <text x="120" y="116" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8B949E">before I trust a number, I ask how it was made</text>

  <text x="48" y="140" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#3B3B3B">$</text>
  <text x="62" y="140" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#6B7280">status</text>
  <text x="130" y="140" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#22C55E">● ACTIVELY LEARNING</text>
  <text x="360" y="140" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#6B7280">building projects in the background</text>

  <!-- blinking cursor -->
  <rect x="660" y="130" width="7" height="13" fill="#00D4FF">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- active indicator -->
  <circle cx="143" cy="136" r="3" fill="#22C55E">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
