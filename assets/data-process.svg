<svg viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Data Process: Question, Filter, Calculate, Compare, Visualize, Conclude">
  <defs>
    <pattern id="procGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#111111" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="flowLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D4FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1000" height="260" fill="#050505"/>
  <rect width="1000" height="260" fill="url(#procGrid)"/>

  <!-- section label -->
  <text x="30" y="28" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11" fill="#6B7280" letter-spacing="3">DATA.PROCESS</text>
  <line x1="175" y1="22" x2="970" y2="22" stroke="#1E1E1E" stroke-width="1"/>
  <text x="30" y="52" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11" fill="#3B3B3B">every analysis follows the same discipline — question first, conclusion last</text>

  <!-- Step cards - Row 1 -->
  <!-- 01 Question -->
  <rect x="30" y="74" width="300" height="60" rx="4" fill="#0A0A0A" stroke="#1E1E1E" stroke-width="1"/>
  <text x="50" y="96" font-family="'JetBrains Mono',monospace" font-size="18" fill="#00D4FF" font-weight="700">01</text>
  <text x="90" y="96" font-family="'JetBrains Mono',monospace" font-size="13" fill="#FFFFFF" font-weight="600">QUESTION</text>
  <text x="50" y="118" font-family="'JetBrains Mono',monospace" font-size="10" fill="#6B7280">What exact question am I answering?</text>

  <!-- arrow -->
  <text x="345" y="108" font-family="'JetBrains Mono',monospace" font-size="14" fill="#1E1E1E">→</text>

  <!-- 02 Filter -->
  <rect x="365" y="74" width="300" height="60" rx="4" fill="#0A0A0A" stroke="#1E1E1E" stroke-width="1"/>
  <text x="385" y="96" font-family="'JetBrains Mono',monospace" font-size="18" fill="#00D4FF" font-weight="700">02</text>
  <text x="425" y="96" font-family="'JetBrains Mono',monospace" font-size="13" fill="#FFFFFF" font-weight="600">FILTER</text>
  <text x="385" y="118" font-family="'JetBrains Mono',monospace" font-size="10" fill="#6B7280">Which rows and columns actually matter?</text>

  <!-- arrow -->
  <text x="680" y="108" font-family="'JetBrains Mono',monospace" font-size="14" fill="#1E1E1E">→</text>

  <!-- 03 Calculate -->
  <rect x="700" y="74" width="270" height="60" rx="4" fill="#0A0A0A" stroke="#1E1E1E" stroke-width="1"/>
  <text x="720" y="96" font-family="'JetBrains Mono',monospace" font-size="18" fill="#00D4FF" font-weight="700">03</text>
  <text x="760" y="96" font-family="'JetBrains Mono',monospace" font-size="13" fill="#FFFFFF" font-weight="600">CALCULATE</text>
  <text x="720" y="118" font-family="'JetBrains Mono',monospace" font-size="10" fill="#6B7280">The simplest operation that answers it</text>

  <!-- Step cards - Row 2 -->
  <!-- 04 Compare -->
  <rect x="30" y="160" width="300" height="60" rx="4" fill="#0A0A0A" stroke="#1E1E1E" stroke-width="1"/>
  <text x="50" y="182" font-family="'JetBrains Mono',monospace" font-size="18" fill="#00D4FF" font-weight="700">04</text>
  <text x="90" y="182" font-family="'JetBrains Mono',monospace" font-size="13" fill="#FFFFFF" font-weight="600">COMPARE</text>
  <text x="50" y="204" font-family="'JetBrains Mono',monospace" font-size="10" fill="#6B7280">A number alone means nothing — vs what?</text>

  <!-- arrow -->
  <text x="345" y="194" font-family="'JetBrains Mono',monospace" font-size="14" fill="#1E1E1E">→</text>

  <!-- 05 Visualize -->
  <rect x="365" y="160" width="300" height="60" rx="4" fill="#0A0A0A" stroke="#1E1E1E" stroke-width="1"/>
  <text x="385" y="182" font-family="'JetBrains Mono',monospace" font-size="18" fill="#00D4FF" font-weight="700">05</text>
  <text x="425" y="182" font-family="'JetBrains Mono',monospace" font-size="13" fill="#FFFFFF" font-weight="600">VISUALIZE</text>
  <text x="385" y="204" font-family="'JetBrains Mono',monospace" font-size="10" fill="#6B7280">The chart that makes it obvious at a glance</text>

  <!-- arrow -->
  <text x="680" y="194" font-family="'JetBrains Mono',monospace" font-size="14" fill="#1E1E1E">→</text>

  <!-- 06 Conclude -->
  <rect x="700" y="160" width="270" height="60" rx="4" fill="#0A0A0A" stroke="#1E1E1E" stroke-width="1"/>
  <rect x="700" y="160" width="270" height="60" rx="4" fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="720" y="182" font-family="'JetBrains Mono',monospace" font-size="18" fill="#00D4FF" font-weight="700">06</text>
  <text x="760" y="182" font-family="'JetBrains Mono',monospace" font-size="13" fill="#FFFFFF" font-weight="600">CONCLUDE</text>
  <text x="720" y="204" font-family="'JetBrains Mono',monospace" font-size="10" fill="#6B7280">One plain sentence — the deliverable</text>

  <!-- flow line animation connecting rows -->
  <rect x="0" y="148" width="150" height="2" fill="url(#flowLine)">
    <animateTransform attributeName="transform" type="translate" values="0,0;1000,0;0,0" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom accent -->
  <text x="30" y="250" font-family="'JetBrains Mono',monospace" font-size="9" fill="#1E1E1E">question_first → conclusion_last</text>
</svg>
