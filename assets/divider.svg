<svg viewBox="0 0 1000 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="section divider">
  <rect width="1000" height="32" fill="#050505"/>
  <line x1="0" y1="16" x2="430" y2="16" stroke="#1E1E1E" stroke-width="1"/>
  <line x1="570" y1="16" x2="1000" y2="16" stroke="#1E1E1E" stroke-width="1"/>

  <!-- center diamond -->
  <g transform="translate(500,16)">
    <rect x="-6" y="-6" width="12" height="12" fill="none" stroke="#00D4FF" stroke-width="1" transform="rotate(45)" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="-2" y="-2" width="4" height="4" fill="#00D4FF" transform="rotate(45)" opacity="0.6"/>
  </g>

  <!-- side dots -->
  <circle cx="420" cy="16" r="2" fill="#00D4FF" opacity="0.3"/>
  <circle cx="580" cy="16" r="2" fill="#00D4FF" opacity="0.3"/>
</svg>
