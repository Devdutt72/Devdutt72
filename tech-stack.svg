<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tech Stack: SQL, Excel, Python, Pandas, NumPy, Matplotlib, Seaborn, Power Query, PowerPoint">
  <defs>
    <pattern id="tGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#141414" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1000" height="300" fill="#050505"/>
  <rect width="1000" height="300" fill="url(#tGrid)"/>

  <!-- header -->
  <text x="30" y="28" font-family="'JetBrains Mono','Courier New',monospace" font-size="13" fill="#8A8A8A" letter-spacing="3">TECHNOLOGY.STACK</text>
  <line x1="250" y1="22" x2="970" y2="22" stroke="#2A2A2A" stroke-width="1"/>

  <!-- Row 1: Querying & Data Handling -->
  <text x="30" y="68" font-family="'JetBrains Mono','Courier New',monospace" font-size="10" fill="#FF7A00" letter-spacing="2">QUERYING &amp; DATA HANDLING</text>

  <rect x="30" y="82" width="110" height="40" rx="3" fill="#0A0A0A" stroke="#2A2A2A" stroke-width="1"/>
  <rect x="30" y="82" width="3" height="40" rx="1" fill="#4479A1"/>
  <text x="88" y="107" font-family="'JetBrains Mono',monospace" font-size="13" fill="#E0E0E0" text-anchor="middle" font-weight="600">SQL</text>

  <rect x="155" y="82" width="110" height="40" rx="3" fill="#0A0A0A" stroke="#2A2A2A" stroke-width="1"/>
  <rect x="155" y="82" width="3" height="40" rx="1" fill="#217346"/>
  <text x="213" y="107" font-family="'JetBrains Mono',monospace" font-size="13" fill="#E0E0E0" text-anchor="middle" font-weight="600">Excel</text>

  <rect x="280" y="82" width="120" height="40" rx="3" fill="#0A0A0A" stroke="#2A2A2A" stroke-width="1"/>
  <rect x="280" y="82" width="3" height="40" rx="1" fill="#3776AB"/>
  <text x="343" y="107" font-family="'JetBrains Mono',monospace" font-size="13" fill="#E0E0E0" text-anchor="middle" font-weight="600">Python</text>

  <rect x="415" y="82" width="120" height="40" rx="3" fill="#0A0A0A" stroke="#2A2A2A" stroke-width="1"/>
  <rect x="415" y="82" width="3" height="40" rx="1" fill="#150458"/>
  <text x="478" y="107" font-family="'JetBrains Mono',monospace" font-size="13" fill="#E0E0E0" text-anchor="middle" font-weight="600">Pandas</text>

  <rect x="550" y="82" width="110" height="40" rx="3" fill="#0A0A0A" stroke="#2A2A2A" stroke-width="1"/>
  <rect x="550" y="82" width="3" height="40" rx="1" fill="#013243"/>
  <text x="608" y="107" font-family="'JetBrains Mono',monospace" font-size="13" fill="#E0E0E0" text-anchor="middle" font-weight="600">NumPy</text>

  <!-- Row 2: Analysis & Visualization -->
  <text x="30" y="162" font-family="'JetBrains Mono','Courier New',monospace" font-size="10" fill="#FF7A00" letter-spacing="2">ANALYSIS &amp; VISUALIZATION</text>

  <rect x="30" y="176" width="150" height="40" rx="3" fill="#0A0A0A" stroke="#2A2A2A" stroke-width="1"/>
  <rect x="30" y="176" width="3" height="40" rx="1" fill="#11557C"/>
  <text x="108" y="201" font-family="'JetBrains Mono',monospace" font-size="13" fill="#E0E0E0" text-anchor="middle" font-weight="600">Matplotlib</text>

  <rect x="195" y="176" width="130" height="40" rx="3" fill="#0A0A0A" stroke="#2A2A2A" stroke-width="1"/>
  <rect x="195" y="176" width="3" height="40" rx="1" fill="#3776AB"/>
  <text x="263" y="201" font-family="'JetBrains Mono',monospace" font-size="13" fill="#E0E0E0" text-anchor="middle" font-weight="600">Seaborn</text>

  <rect x="340" y="176" width="160" height="40" rx="3" fill="#0A0A0A" stroke="#2A2A2A" stroke-width="1"/>
  <rect x="340" y="176" width="3" height="40" rx="1" fill="#217346"/>
  <text x="423" y="201" font-family="'JetBrains Mono',monospace" font-size="13" fill="#E0E0E0" text-anchor="middle" font-weight="600">Power Query</text>

  <rect x="515" y="176" width="200" height="40" rx="3" fill="#0A0A0A" stroke="#2A2A2A" stroke-width="1"/>
  <rect x="515" y="176" width="3" height="40" rx="1" fill="#FF7A00"/>
  <text x="618" y="201" font-family="'JetBrains Mono',monospace" font-size="12" fill="#E0E0E0" text-anchor="middle" font-weight="600">Hypothesis Testing</text>

  <!-- Row 3: Reporting -->
  <text x="30" y="256" font-family="'JetBrains Mono','Courier New',monospace" font-size="10" fill="#FF7A00" letter-spacing="2">REPORTING</text>

  <rect x="30" y="270" width="150" height="22" rx="3" fill="#0A0A0A" stroke="#2A2A2A" stroke-width="1"/>
  <rect x="30" y="270" width="3" height="22" rx="1" fill="#B7472A"/>
  <text x="108" y="285" font-family="'JetBrains Mono',monospace" font-size="11" fill="#E0E0E0" text-anchor="middle">PowerPoint</text>

  <rect x="195" y="270" width="150" height="22" rx="3" fill="#0A0A0A" stroke="#2A2A2A" stroke-width="1"/>
  <rect x="195" y="270" width="3" height="22" rx="1" fill="#217346"/>
  <text x="273" y="285" font-family="'JetBrains Mono',monospace" font-size="11" fill="#E0E0E0" text-anchor="middle">Pivot Tables</text>

  <rect x="360" y="270" width="170" height="22" rx="3" fill="#0A0A0A" stroke="#2A2A2A" stroke-width="1"/>
  <rect x="360" y="270" width="3" height="22" rx="1" fill="#217346"/>
  <text x="448" y="285" font-family="'JetBrains Mono',monospace" font-size="11" fill="#E0E0E0" text-anchor="middle">Dynamic Arrays</text>
</svg>
